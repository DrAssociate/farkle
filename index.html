<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Farkle</title>
  </head>
  <body>
    <h1 class="heading">Farkle</h1>
    <main>
      <div id="computer">
        <h2 id="comp-numbers">The opponent threw:</h2>
        <div id="comp-holding-container"></div>
        <div class="comp-rolled-container">
          <div id="compDie1" tabindex="0"></div>
          <div id="compDie2" tabindex="0"></div>
          <div id="compDie3" tabindex="0"></div>
          <div id="compDie4" tabindex="0"></div>
          <div id="compDie5" tabindex="0"></div>
          <div id="compDie6" tabindex="0"></div>
        </div>
      </div>
      <section id="comp-score-container">
        <div>Comp score: <span id="comp-score">0</span></div></div>
      </section>
      <div id="decision-btns">
        <button id="throw-btn">Throw</button>
        <button id="throw-again" class="locked">Throw again</button>
        <button id="end-turn">End turn</button>
      </div>
      <div id="user">
        <h2 id="user-numbers">You threw:</h2>
        <div class="user-rolled-container">
          <div id="userDie1" tabindex="0"></div>
          <div id="userDie2" tabindex="0"></div>
          <div id="userDie3" tabindex="0"></div>
          <div id="userDie4" tabindex="0"></div>
          <div id="userDie5" tabindex="0"></div>
          <div id="userDie6" tabindex="0"></div>
        </div>
      </div>
      <div id="user-holding-container"></div>
      <section id="user-score-container">
        <div>Your score: <span id="user-score">0</span></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
